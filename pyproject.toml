[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-vulnerability-intelligence"
version = "0.1.0"
description = "Evidence-first local AI vulnerability intelligence"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
 "SQLAlchemy==2.0.44", "alembic==1.17.1", "httpx==0.28.1",
 "pydantic-settings==2.11.0", "typer==0.20.0", "openpyxl==3.1.5",
 "APScheduler==3.11.1", "PyYAML==6.0.3", "streamlit>=1.54.0,<2",
 "psycopg[binary]==3.2.12", "ijson==3.4.0.post0", "pillow>=13.0.0", "pyarrow>=23.0.1"
]
[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-httpx>=0.36.0,<1", "ruff==0.14.3", "pip-audit==2.9.0"]
[project.scripts]
aivi = "app.cli:main"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
