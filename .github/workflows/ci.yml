name: tests
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./scripts/setup_macos.sh --dev
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python scripts/smoke_native.py
      - run: .venv/bin/ruff check app tests scripts --select F
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aivi_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U test -d aivi_test" --health-interval=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.9.7
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test-only-password@localhost:5432/aivi_test
      - run: uv run ruff check app tests --select F
      - run: uv run pip-audit
